columns:
  - name: "PA_CODUNI"
    type: "char(7)"
    description: "Código do CNES do Estabelecimento de Saúde."
  - name: "PA_GESTAO"
    type: "char(6)"
    description: "Unidade de Federação + Código Município de Gestão ou UF0000 se a Unidade está sob Gestão Estadual."
  - name: "PA_CONDIC"
    type: "char(2)"
    description: "Sigla do Tipo de Gestão que o Estado ou Município está habilitado."
  - name: "PA_UFMUN"
    type: "char(6)"
    description: "Unidade da Federação + município do Estabelecimento."
  - name: "PA_REGCT"
    type: "char(4)"
    description: "Código da Regra Contratual."
  - name: "PA_INCOUT"
    type: "char(4)"
    description: "Incremento Outros."
  - name: "PA_INCURG"
    type: "char(4)"
    description: "Incremento Urgência."
  - name: "PA_TPUPS"
    type: "char(2)"
    description: "Tipo de do Estabelecimento."
  - name: "PA_TIPPRE"
    type: "char(2)"
    description: "Tipo de Prestador."
  - name: "PA_MN_IND"
    type: "char(1)"
    description: "Mantida / Individual."
  - name: "PA_CNPJCPF"
    type: "char(14)"
    description: "CNPJ do Estabelecimento executante."
  - name: "PA_CNPJMNT"
    type: "char(14)"
    description: "CNPJ da Mantenedora do Estabelecimento ou zeros caso não a tenha."
  - name: "PA_CNP_CC"
    type: "char(14)"
    description: "CNPJ do órgão que recebeu por cessão de crédito ou zeros caso não a tenha."
  - name: "PA_DATPR"
    type: "char(6)"
    description: "Data de Processamento/Movimento (AAAAMM)."
  - name: "PA_DATREF"
    type: "char(6)"
    description: "Data da realização do Procedimento / Competência (AAAAMM)."
  - name: "PA_PROCID"
    type: "char(10)"
    description: "Código de procedimento Ambulatorial."
  - name: "PA_TPFIN"
    type: "char(2)"
    description: "Tipo de Financiamento da produção."
  - name: "PA_SUBFIN"
    type: "char(4)"
    description: "Subtipo de Financiamento da produção."
  - name: "PA_NIVCPL"
    type: "char(1)"
    description: "Complexidade do Procedimento."
  - name: "PA_DOCORIG"
    type: "char(1)"
    description: "Documento de Registro: 'B' para BPA-C, 'A' para APAC, 'I' para BPA-I."
  - name: "PA_AUTORIZ"
    type: "char(13)"
    description: "Número da APAC / número de autorização do BPA-I (conforme o caso)."
  - name: "PA_CNSMED"
    type: "char(14)"
    description: "Número CNS do profissional de saúde executante."
  - name: "PA_CBOCOD"
    type: "char(6)"
    description: "Código de Ocupação Brasileira do Profissional de saúde executante."
  - name: "PA_MOTSAI"
    type: "char(2)"
    description: "Motivo de Saída ou zeros caso não tenha."
  - name: "PA_CIDPRI"
    type: "char(4)"
    description: "CID Principal (APAC ou BPA-I)."
  - name: "PA_CIDSEC"
    type: "char(4)"
    description: "CID Secundário (APAC ou BPA-I)."
  - name: "PA_CIDCAS"
    type: "char(4)"
    description: "CID Causas Associadas (APAC ou BPA-I)."
  - name: "PA_IDADE"
    type: "char(3)"
    description: "Idade em anos."
  - name: "PA_SEXO"
    type: "char(1)"
    description: "SEXO do Paciente."
  - name: "PA_RACACOR"
    type: "char(2)"
    description: "Raça/Cor do Paciente."
  - name: "PA_MUNPCT"
    type: "char(6)"
    description: "Unidade da Federação + município do município do paciente ou do estabelecimento, caso não se tenha a identificação do paciente o que ocorre no (BPA)."
  - name: "PA_QTDPRO"
    type: "numeric(8)"
    description: "Quantidade Produzida (APRESENTADA)."
  - name: "PA_QTDAPR"
    type: "numeric(8)"
    description: "Quantidade aprovada."
  - name: "PA_CODOCO"
    type: "char(1)"
    description: "Código de Ocorrência (S01=1,S02=2,...,S05=5)."
  - name: "PA_INDICA"
    type: "char(1)"
    description: "Indicativo de situação da produção produzida: 0 = não aprovado, 5 = aprovado total, 6 = aprovado parcial."
  - name: "PA_VALPRO"
    type: "numeric(20, 2)"
    description: "Valor Produzido (APRESENTADO)."
  - name: "PA_VALAPR"
    type: "numeric(20, 2)"
    description: "Valor Aprovado."
  - name: "PA_UFDIF"
    type: "char(1)"
    description: "Indica se a UF de residência do paciente é diferente da UF de localização do estabelecimento (N=não, S=sim)."
  - name: "PA_MNDIF"
    type: "char(1)"
    description: "Indica se o município de residência do paciente é diferente do município de localização do estabelecimento (N=não, S=sim)."
  - name: "PA_DIF_VAL"
    type: "numeric(20, 2)"
    description: "Diferença de Valores de Valores Unitários praticados na Tabela Unificada com a Tabela de Valores praticados pelo Gestor da Produção multiplicado pela Quantidade Aprovada do procedimento."
  - name: "NU_VPA_TOT"
    type: "numeric(20, 2)"
    description: "Valor Unitário Do Procedimento da Tabela VPA."
  - name: "NU_PA_TOT"
    type: "numeric(20, 2)"
    description: "Valor Unitário Do Procedimento da Tabela SIGTAP."