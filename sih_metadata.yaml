# Arquivo de configuração para o schema do dataset SIH.
# Este arquivo define o nome, tipo e descrição de cada coluna,
# permitindo que o script de processamento seja agnóstico à estrutura dos dados.

columns:
  - name: "UF_ZI"
    type: "char(6)"
    description: "Municipality of the healthcare provider."
  - name: "ANO_CMPT"
    type: "char(4)"
    description: "Year of AIH processing (yyyy)."
  - name: "MES_CMPT"
    type: "char(2)"
    description: "Month of AIH processing (mm)."
  - name: "ESPEC"
    type: "char(2)"
    description: "Type of hospital bed specialty."
  - name: "CGC_HOSP"
    type: "char(14)"
    description: "Hospital's CNPJ (tax identification number)."
  - name: "N_AIH"
    type: "char(13)"
    description: "AIH (Authorization for Hospitalization) number."
  - name: "IDENT"
    type: "char(1)"
    description: "Identification of the type of AIH."
  - name: "CEP"
    type: "char(8)"
    description: "Patient's postal code."
  - name: "MUNIC_RES"
    type: "char(6)"
    description: "Patient's municipality of residence."
  - name: "NASC"
    type: "char(8)"
    description: "Patient's date of birth (yyyymmdd)."
  - name: "SEXO"
    type: "char(1)"
    description: "Patient’s gender."
  - name: "UTI_MES_IN"
    type: "numeric(2)"
    description: "ICU days in the month (input)."
  - name: "UTI_MES_AN"
    type: "numeric(2)"
    description: "ICU days in the month (annual)."
  - name: "UTI_MES_AL"
    type: "numeric(2)"
    description: "ICU days in the month (allocation)."
  - name: "UTI_MES_TO"
    type: "numeric(3)"
    description: "Total ICU days in the month."
  - name: "MARCA_UTI"
    type: "char(2)"
    description: "Type of ICU used by the patient."
  - name: "UTI_INT_IN"
    type: "numeric(2)"
    description: "Intermediate care unit days (input)."
  - name: "UTI_INT_AN"
    type: "numeric(2)"
    description: "Intermediate care unit days (annual)."
  - name: "UTI_INT_AL"
    type: "numeric(2)"
    description: "Intermediate care unit days (allocation)."
  - name: "UTI_INT_TO"
    type: "numeric(3)"
    description: "Total intermediate care unit days."
  - name: "DIAR_ACOM"
    type: "numeric(3)"
    description: "Quantidade de diárias de acompanhante."
  - name: "QT_DIARIAS"
    type: "numeric(3)"
    description: "Quantidade de diárias."
  - name: "PROC_SOLIC"
    type: "char(10)"
    description: "Procedimento solicitado."
  - name: "PROC_REA"
    type: "char(10)"
    description: "Procedimento realizado."
  - name: "VAL_SH"
    type: "numeric(13, 2)"
    description: "Valor de serviços hospitalares."
  - name: "VAL_SP"
    type: "numeric(13, 2)"
    description: "Valor de serviços profissionais."
  - name: "VAL_SADT"
    type: "numeric(13, 2)"
    description: "Zerado"
  - name: "VAL_RN"
    type: "numeric(13, 2)"
    description: "Zerado"
  - name: "VAL_ACOMP"
    type: "numeric(13, 2)"
    description: "Zerado"
  - name: "VAL_ORTP"
    type: "numeric(13, 2)"
    description: "Zerado"
  - name: "VAL_SANGUE"
    type: "numeric(13, 2)"
    description: "Zerado"
  - name: "VAL_SADTSR"
    type: "numeric(11, 2)"
    description: "Zerado"
  - name: "VAL_TRANSP"
    type: "numeric(13, 2)"
    description: "Zerado"
  - name: "VAL_OBSANG"
    type: "numeric(11, 2)"
    description: "Zerado"
  - name: "VAL_PED1AC"
    type: "numeric(11, 2)"
    description: "Zerado"
  - name: "VAL_TOT"
    type: "numeric(14, 2)"
    description: "Valor total da AIH."
  - name: "VAL_UTI"
    type: "numeric(8, 2)"
    description: "Valor de UTI."
  - name: "US_TOT"
    type: "numeric(8, 2)"
    description: "Valor total em dólar."
  - name: "DT_INTER"
    type: "char(8)"
    description: "Data de internação no formato aaammdd."
  - name: "DT_SAIDA"
    type: "char(8)"
    description: "Data de saída no formato aaaammdd."
  - name: "DIAG_PRINC"
    type: "char(4)"
    description: "Código do diagnóstico principal (CID10)."
  - name: "DIAG_SECUN"
    type: "char(4)"
    description: "Código do diagnostico secundário (CID10). Preenchido com zeros a partir de 201501."
  - name: "COBRANCA"
    type: "char(2)"
    description: "Motivo de Saída/Permanência"
  - name: "NATUREZA"
    type: "char(2)"
    description: "Natureza jurídica do hospital (com conteúdo até maio/12). Era utilizada a classificação de Regime e Natureza."
  - name: "NAT_JUR"
    type: "char(4)"
    description: "Natureza jurídica do Estabelecimento conforme a Comissão Nacional de Classificação - CONCLA"
  - name: "GESTAO"
    type: "char(1)"
    description: "Indica o tipo de gestão do hospital."
  - name: "RUBRICA"
    type: "numeric(5)"
    description: "Zerado"
  - name: "IND_VDRL"
    type: "char(1)"
    description: "Indica exame VDRL."
  - name: "MUNIC_MOV"
    type: "char(6)"
    description: "Município do Estabelecimento."
  - name: "COD_IDADE"
    type: "char(1)"
    description: "Unidade de medida da idade."
  - name: "IDADE"
    type: "numeric(2)"
    description: "Idade."
  - name: "DIAS_PERM"
    type: "numeric(5)"
    description: "Dias de Permanência."
  - name: "MORTE"
    type: "numeric(1)"
    description: "Indica Óbito"
  - name: "NACIONAL"
    type: "char(2)"
    description: "Código da nacionalidade do paciente."
  - name: "NUM_PROC"
    type: "char(4)"
    description: "Zerado"
  - name: "CAR_INT"
    type: "char(2)"
    description: "Caráter da internação."
  - name: "TOT_PT_SP"
    type: "numeric(6)"
    description: "Zerado"
  - name: "CPF_AUT"
    type: "char(11)"
    description: "Zerado"
  - name: "HOMONIMO"
    type: "char(1)"
    description: "Indicador se o paciente da AIH é homônimo do paciente de outra AIH."
  - name: "NUM_FILHOS"
    type: "numeric(2)"
    description: "Número de filhos do paciente."
  - name: "INSTRU"
    type: "char(1)"
    description: "Grau de instrução do paciente."
  - name: "CID_NOTIF"
    type: "char(4)"
    description: "CID de Notificação."
  - name: "CONTRACEP1"
    type: "char(2)"
    description: "Tipo de contraceptivo utilizado."
  - name: "CONTRACEP2"
    type: "char(2)"
    description: "Segundo tipo de contraceptivo utilizado."
  - name: "GESTRISCO"
    type: "char(1)"
    description: "Indicador se é gestante de risco."
  - name: "INSC_PN"
    type: "char(12)"
    description: "Número da gestante no pré-natal."
  - name: "SEQ_AIH5"
    type: "char(3)"
    description: "Sequencial de longa permanência (AIH tipo 5)."
  - name: "CBOR"
    type: "char(3)"
    description: "Ocupação do paciente segundo a Classificação Brasileira de Ocupações – CBO."
  - name: "CNAER"
    type: "char(3)"
    description: "Código de acidente de trabalho."
  - name: "VINCPREV"
    type: "char(1)"
    description: "Vínculo com a Previdência."
  - name: "GESTOR_COD"
    type: "char(3)"
    description: "Motivo de autorização da AIH pelo Gestor."
  - name: "GESTOR_TP"
    type: "char(1)"
    description: "Tipo de gestor."
  - name: "GESTOR_CPF"
    type: "char(11)"
    description: "Número do CPF do Gestor."
  - name: "GESTOR_DT"
    type: "char(8)"
    description: "Data da autorização dada pelo Gestor (aaaammdd)."
  - name: "CNES"
    type: "char(7)"
    description: "Código CNES do hospital."
  - name: "CNPJ_MANT"
    type: "char(14)"
    description: "CNPJ da mantenedora."
  - name: "INFEHOSP"
    type: "char(1)"
    description: "Status de infecção hospitalar."
  - name: "CID_ASSO"
    type: "char(4)"
    description: "CID causa."
  - name: "CID_MORTE"
    type: "char(4)"
    description: "CID da morte."
  - name: "COMPLEX"
    type: "char(2)"
    description: "Complexidade."
  - name: "FINANC"
    type: "char(2)"
    description: "Tipo de financiamento."
  - name: "FAEC_TP"
    type: "char(6)"
    description: "Subtipo de financiamento FAEC."
  - name: "REGCT"
    type: "char(4)"
    description: "Regra contratual."
  - name: "RACA_COR"
    type: "char(4)"
    description: "Raça/Cor do paciente."
  - name: "ETNIA"
    type: "char(4)"
    description: "Etnia do paciente se raça cor for indígena."
  - name: "SEQUENCIA"
    type: "numeric(9)"
    description: "Sequencial da AIH na remessa."
  - name: "REMESSA"
    type: "char(21)"
    description: "Número da remessa."
  - name: "AUD_JUST"
    type: "char(50)"
    description: "Justificativa do auditor para aceitação da AIH sem o número do Cartão Nacional de Saúde."
  - name: "SIS_JUST"
    type: "char(50)"
    description: "Justificativa do estabelecimento para aceitação da AIH sem o número do Cartão Nacional de Saúde."
  - name: "VAL_SH_FED"
    type: "numeric(8, 2)"
    description: "Valor do complemento federal de serviços hospitalares. Está incluído no valor total da AIH."
  - name: "VAL_SP_FED"
    type: "numeric(8, 2)"
    description: "Valor do complemento federal de serviços profissionais. Está incluído no valor total da AIH."
  - name: "VAL_SH_GES"
    type: "numeric(8, 2)"
    description: "Valor do complemento do gestor (estadual ou municipal) de serviços hospitalares. Está incluído no valor total da AIH."
  - name: "VAL_SP_GES"
    type: "numeric(8, 2)"
    description: "Valor do complemento do gestor (estadual ou municipal) de serviços profissionais. Está incluído no valor total da AIH."
  - name: "VAL_UCI"
    type: "numeric(8, 2)"
    description: "Valor de UCI."
  - name: "MARCA_UCI"
    type: "char(2)"
    description: "Tipo de UCI utilizada pelo paciente."
  - name: "DIAGSEC1"
